site_name: Ing. Tomáš Hák
site_description: Information about my projects and work - Tomas Hak
site_author: Tomas Hak
site_url: https://mydomain.org/mysite
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  font:
    text: "Segoe UI"
    code: "JetBrains Mono"
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
extra_css:
  - stylesheets/extra.css
plugins:
  - search